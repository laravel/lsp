name: Build Release Binaries

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64-linux
            spc_suffix: linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64-linux
            spc_suffix: linux-aarch64.tar.gz
          - os: macos-latest
            arch: x64-darwin
            spc_suffix: macos-x86_64.tar.gz
          - os: macos-14
            arch: arm64-darwin
            spc_suffix: macos-aarch64.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.2"
          extensions: bcmath,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,iconv,mbstring,openssl,pcntl,pdo_mysql,pdo_sqlite,pdo,phar,posix,readline,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib

      - name: Install dependencies
        run: |
          composer install --prefer-dist --no-progress --no-dev --quiet

      - name: Install SPC
        run: |
          curl -O -L "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-${{ matrix.spc_suffix }}"
          tar xzf "spc-${{ matrix.spc_suffix }}"
          chmod +x ./spc
          ./spc --version

      - name: Build Binary
        run: |
          echo "" > .env
          php server app:build --build-version=${{ github.ref_name }}
          chmod +x ./builds/server && ./builds/server --version

      - name: Download PHP
        run: |
          curl -O -L "https://dl.static-php.dev/static-php-cli/common/php-8.3.9-micro-${{ matrix.spc_suffix }}"
          tar xzf "php-8.3.9-micro-${{ matrix.spc_suffix }}"
          mkdir -p buildroot/bin
          mv micro.sfx buildroot/bin

      - name: SPC Combine
        run: |
          ./spc micro:combine builds/server -O bin/server-${{ github.ref_name }}-${{ matrix.arch }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.arch }}
          path: bin/server-${{ github.ref_name }}-${{ matrix.arch }}

  release:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Flatten artifacts into release directory
        run: |
          mkdir -p release
          find dist -type f -name 'server-*' -exec cp {} release/ \;

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
