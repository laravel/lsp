name: Build Release Binaries

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64-linux
            spc_suffix: linux-x86_64.tar.gz
          - os: ubuntu-24.04-arm
            arch: arm64-linux
            spc_suffix: linux-aarch64.tar.gz
          - os: macos-latest
            arch: x64-darwin
            spc_suffix: macos-x86_64.tar.gz
          - os: macos-14
            arch: arm64-darwin
            spc_suffix: macos-aarch64.tar.gz
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: bcmath,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,iconv,mbstring,openssl,pcntl,pdo_mysql,pdo_sqlite,pdo,phar,posix,readline,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib

      - name: Install SPC
        run: |
          curl -O -L "https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-${{ matrix.spc_suffix }}"
          tar xzf "spc-${{ matrix.spc_suffix }}"
          chmod +x ./spc
          ./spc --version

      - name: Smoke Test Committed PHAR
        run: |
          chmod +x ./builds/laravel-lsp
          VERSION=$(./builds/laravel-lsp --version)
          echo "$VERSION"
          [[ "$VERSION" == *"${{ github.ref_name }}"* ]]
          ./builds/laravel-lsp list

      - name: Download PHP
        run: |
          curl -O -L "https://dl.static-php.dev/static-php-cli/common/php-8.3.9-micro-${{ matrix.spc_suffix }}"
          tar xzf "php-8.3.9-micro-${{ matrix.spc_suffix }}"
          mkdir -p buildroot/bin
          mv micro.sfx buildroot/bin

      - name: SPC Combine
        run: |
          ./spc micro:combine builds/laravel-lsp -I "memory_limit=512M" -O bin/server-${{ github.ref_name }}-${{ matrix.arch }}

      - name: Upload binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ matrix.arch }}
          path: bin/server-${{ github.ref_name }}-${{ matrix.arch }}

  build-windows:
    name: Build Binary (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: "8.2"
          extensions: bcmath,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,iconv,mbstring,openssl,pcntl,pdo_mysql,pdo_sqlite,pdo,phar,posix,readline,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib

      - name: Install SPC
        run: |
          curl -L -O https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-windows-x64.exe
          .\spc-windows-x64.exe --version

      - name: Smoke Test Committed PHAR
        run: |
          $version = php .\builds\laravel-lsp --version
          $version
          if (-not $version.Contains("${{ github.ref_name }}")) { exit 1 }
          php .\builds\laravel-lsp list

      - name: Download PHP
        run: |
          curl -L -O https://dl.static-php.dev/static-php-cli/windows/spc-max/php-8.3.30-micro-win.zip
          tar -xf php-8.3.30-micro-win.zip
          mkdir -p buildroot/bin
          mv micro.sfx buildroot/bin

      - name: SPC Combine
        run: |
          .\spc-windows-x64.exe micro:combine builds/laravel-lsp -I "memory_limit=512M" -O bin/server-${{ github.ref_name }}-x64-win32

      - name: Upload binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-x64-win32
          path: bin/server-${{ github.ref_name }}-x64-win32.exe

  release:
    name: Publish Release
    needs: [build, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist

      - name: Flatten artifacts into release directory
        run: |
          mkdir -p release
          cp builds/laravel-lsp release/laravel-lsp
          find dist -type f -name 'server-*' -exec cp {} release/ \;

      - name: Create release and upload binaries
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: release/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
