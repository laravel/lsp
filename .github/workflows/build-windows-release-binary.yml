name: Build Windows Release Binary

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build Binary (Windows)
    runs-on: windows-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: "8.2"
          tools: composer:v2
          extensions: bcmath,calendar,ctype,curl,dba,dom,exif,fileinfo,filter,iconv,mbstring,openssl,pcntl,pdo_mysql,pdo_sqlite,pdo,phar,posix,readline,session,simplexml,sockets,sodium,sqlite3,tokenizer,xml,xmlreader,xmlwriter,zip,zlib

      - name: Install dependencies
        shell: pwsh
        run: |
          composer install --prefer-dist --no-progress --no-dev --quiet

      - name: Install SPC
        run: |
          curl -L -O https://github.com/crazywhalecc/static-php-cli/releases/latest/download/spc-windows-x64.exe
          .\spc-windows-x64.exe --version

      - name: Verify Composer
        shell: pwsh
        run: |
          composer --version
          where.exe composer

      - name: Build Binary
        shell: pwsh
        env:
          COMPOSER_BINARY: composer.bat
        run: |
          php server app:build --build-version=${{ github.ref_name }} -vvv

      - name: Download PHP
        run: |
          curl -L -O https://dl.static-php.dev/static-php-cli/windows/spc-max/php-8.3.9-micro-win.zip
          tar -xf php-8.3.9-micro-win.zip
          mkdir -p buildroot/bin
          mv micro.sfx buildroot/bin

      - name: SPC Combine
        run: |
          .\spc-windows-x64.exe micro:combine builds/server -O bin/server-${{ github.ref_name }}-x64-win32

      - name: Upload binary as artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server-${{ github.ref_name }}-x64-win32
          path: bin/server-${{ github.ref_name }}-x64-win32.exe

      - name: Create Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            bin/server-${{ github.ref_name }}-x64-win32.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
